# LLAMA-ONLY SUBSET (2026-09-26, operational-only, not a frozen artifact): generated from config/paper/arc_reasoning_batch.yaml by removing non-llama model entries verbatim (dropped: ['openai', 'anthropic', 'together', 'huggingface', 'huggingface']). Retained entry (deepinfra) is byte-identical to the frozen config. See config/paper/arc_reasoning_batch.yaml for the frozen original.
experiment:
  name: paper_arc_reasoning_batch
models:
- backend: api
  provider: deepinfra
  model_name_or_path: meta-llama/Meta-Llama-3.1-8B-Instruct-Turbo
  concurrency_limit: 10
  generation_kwargs:
    max_new_tokens: 1024
    temperature: 0.0
benchmarks:
- name: arc_challenge
  split: test
  transforms: []
  question_id_manifest: data/manifests/arc_challenge_eval_v2.csv
methods:
- name: reasoning_cyclic
  execution_mode: batch
metrics:
- accuracy
- mad
run:
  seed: 42
  resume: true
  dry_run: false
  checkpoint_every_n: 50
  prompt_version: v1_reasoning
  concurrency_limit: 10
  cache_scope: per_run
