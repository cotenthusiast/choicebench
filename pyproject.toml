[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "choicebench"
version = "0.1.0"
description = "A lightweight workbench for MCQ evaluation-method experiments"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "datasets",
    "python-dotenv",
    "openai",
    "google-genai",
    "groq",
    "pyyaml",
]

[project.optional-dependencies]
hf = [
    "torch",
    "transformers",
    "accelerate",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[project.urls]
Homepage = "https://github.com/cotenthusiast/choicebench"
Repository = "https://github.com/cotenthusiast/choicebench"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
