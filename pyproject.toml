[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "choicebench"
version = "0.1.3"
description = "A lightweight framework for MCQ evaluation-method research"
readme = "README.md"
authors = [{name = "Karl Hanna"}]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "datasets",
    "python-dotenv",
    "anthropic>=0.20.0",
    # openai_client.py's Batch API result parsing (OpenAIResponsesResponse.
    # model_validate) silently breaks (parsed fields come back None
    # instead of raising) somewhere between openai 2.33.0 and 2.54.0 --
    # confirmed 2.33.0 passes tests/clients/test_openai_client.py and
    # tests/integration/test_batch_execution_end_to_end.py cleanly, 2.54.0
    # does not. Pinned exactly to the verified-working version until the
    # parsing is updated for whatever changed.
    "openai==2.33.0",
    "google-genai",
    "groq",
    "pyyaml",
    # TogetherAIClient's synchronous path stays on the OpenAI SDK pointed at
    # Together's OpenAI-compatible endpoint (unchanged) -- this is only for
    # Together's native Batch API (client.batches / client.files.upload),
    # which is not exposed through the OpenAI-compatible surface.
    "together>=2.0",
]

[project.optional-dependencies]
hf = [
    "torch",
    "transformers",
    "accelerate",
    # Lets AutoModelForCausalLM.from_pretrained() load compressed-tensors
    # FP8 checkpoints (e.g. RedHatAI's *-FP8-dynamic models) directly --
    # confirmed this works via plain Transformers, no vLLM required, and
    # (unlike vLLM's logprob interface) still exposes full-vocabulary
    # logits for score_options()-dependent methods (PriDe, cyclic_logprob,
    # direct_logprob). No-op for ordinary non-quantized checkpoints.
    "compressed-tensors",
]
matching = [
    "sentence-transformers",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "httpx",
    "build",
    "twine",
]
# vLLM support: vLLM is NOT a Python dependency of ChoiceBench. Run it as a
# separate server (e.g. `vllm serve <model> --port 8000`) and point ChoiceBench
# at it via provider: vllm / base_url in your experiment config. The openai SDK
# (already a core dependency) handles all HTTP communication.

[project.urls]
Homepage = "https://github.com/cotenthusiast/choicebench"
Repository = "https://github.com/cotenthusiast/choicebench"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
