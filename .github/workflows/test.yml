name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,hf,matching]"

      - name: Run tests
        run: pytest tests/ -v

      # Spec-derived protocol checks (tests_conformance/FROZEN_SPEC.md). Tests that need
      # locally prepared benchmark data skip themselves in a clean checkout.
      - name: Run conformance suite
        run: pytest tests_conformance/ -v
