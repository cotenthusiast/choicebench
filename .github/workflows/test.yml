name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,hf,matching]"

      - name: Run tests
        run: pytest tests/ -v

      # The conformance suite checks the frozen manifests and PriDe calibration against the
      # real MMLU/ARC-Challenge sources. Prepare them exactly as documented in the README
      # (same flags, so the artifact ids match the ones the frozen configs reference).
      - name: Prepare benchmark data
        run: |
          python scripts/prepare_data.py --hf-path cais/mmlu --hf-subset all --split test --exclude-duplicate-question-ids --output-name mmlu
          python scripts/prepare_data.py --hf-path cais/mmlu --hf-subset all --split validation --exclude-duplicate-question-ids --output-name mmlu
          python scripts/prepare_data.py --hf-path allenai/ai2_arc --hf-subset ARC-Challenge --split test --output-name arc_challenge
          python scripts/prepare_data.py --hf-path allenai/ai2_arc --hf-subset ARC-Challenge --split validation --output-name arc_challenge

      # Spec-derived protocol checks (tests_conformance/FROZEN_SPEC.md).
      - name: Run conformance suite
        run: pytest tests_conformance/ -v
