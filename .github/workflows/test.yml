name: tests

on:
  push:
    # Branch pushes only: archive tags point at old commits whose workflow files predate
    # later CI fixes, and running them just produces misleading failures.
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,hf,matching]"

      # Several unit tests and the conformance suite check the frozen manifests, ARC option counts
      # and PriDe calibration against the real MMLU/ARC-Challenge sources. Prepare them exactly as
      # documented in the README (same flags, so the artifact ids match the ones the frozen
      # configs reference); otherwise those tests skip themselves.
      - name: Prepare benchmark data
        run: |
          python scripts/prepare_data.py --hf-path cais/mmlu --hf-subset all --split test --exclude-duplicate-question-ids --output-name mmlu
          python scripts/prepare_data.py --hf-path cais/mmlu --hf-subset all --split validation --exclude-duplicate-question-ids --output-name mmlu
          python scripts/prepare_data.py --hf-path allenai/ai2_arc --hf-subset ARC-Challenge --split test --output-name arc_challenge
          python scripts/prepare_data.py --hf-path allenai/ai2_arc --hf-subset ARC-Challenge --split validation --output-name arc_challenge
          # Some tests still read the legacy flat path; its content is byte-identical to the
          # artifact's normalized.csv.
          cp data/processed/arc_challenge/test/norm-v2/src_*/normalized.csv data/processed/arc_challenge_normalized.csv

      - name: Run tests
        run: pytest tests/ -v

      # Spec-derived protocol checks (tests_conformance/FROZEN_SPEC.md).
      - name: Run conformance suite
        run: pytest tests_conformance/ -v
