schema_version: flip_rate_traces.prepared.v1

model:
  name: gemini-2.5-flash
  provider: gemini
  backend: api
  concurrency: 1
  min_delay_seconds: 1.5
  max_retries: 5
  timeout_seconds: 30

defaults:
  temperature: 0.0
  max_tokens: 500
  seed: 42
  top_p: null
  stop: null
  request_logprobs: false
  prompt_version: v1
  batching: per_question_all_permutations

paths:
  output_root: ../../runs/flip_rate_traces
  checkpoint_root: ../../checkpoints/flip_rate_traces
  cache_root: ../../.cache/flip_rate_traces_prepared_v1
  legacy_cache_root: "${LEGACY_TWOPROMPT_CACHE_ROOT}"

prompts:
  option_matching: |-
    You are given a question, a reference answer, and four options.

    Question: {question}

    Reference answer: {free_text}

    Options:
    A. {option_a}
    B. {option_b}
    C. {option_c}
    D. {option_d}

    Select the option that best matches the reference answer in the context of the question.
    If the reference answer is imperfect or incomplete, choose the closest option.
    Respond with only the letter.
  cot_stage1: |-
    Answer the following question based on your knowledge.

    Question: {question}

    Work through the problem step by step and make the reasoning explicit. Then conclude with a concise final answer that can be matched to a multiple-choice option.

