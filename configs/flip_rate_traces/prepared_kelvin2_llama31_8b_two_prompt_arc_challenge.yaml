  backend: local
  concurrency: 1
  min_delay_seconds: 0.0
  max_retries: 0
  timeout_seconds: null
  device: cuda
  revision: null
  add_bos_token: true
  torch_dtype: float16
  prompt_application: raw_no_chat_template

defaults:
  temperature: 0.0
  max_tokens: 500
  seed: 42
  top_p: null
  stop: null
  request_logprobs: false
  do_sample: false
  prompt_version: v1
  batching: sequential_permutation

