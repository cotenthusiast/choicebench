# config/toy_experiment.yaml
#
# Onboarding config. Uses DummyBackend (fixed responses, no model weights,
# no API calls) against a tiny bundled 10-question synthetic dataset
# (data/processed/toy_normalized.csv) so the pipeline can be exercised
# without a GPU or any API key.
#
# Real benchmark data (MMLU, ARC-Challenge) is NOT bundled in this repo —
# data/processed/ ships only the toy CSV plus a .gitkeep. See
# scripts/prepare_data.py for how real benchmark data is downloaded and
# normalized. benchmark.name is "toy" here, pointing at the bundled toy CSV,
# so this config runs end-to-end without downloading anything first.

experiment:
  name: toy_experiment

models:
  - backend: dummy
    model_name_or_path: dummy_1
    device: cpu
    generation_kwargs:
      max_new_tokens: 16
      temperature: 0.0
      do_sample: false
  - backend: dummy
    model_name_or_path: dummy_2
    device: cpu
    generation_kwargs:
      max_new_tokens: 16
      temperature: 0.0
      do_sample: false

benchmarks:
  - name: toy
    split: test
    n_samples: 10
    subject_filter: null

methods:
  - name: direct_mcq

metrics:
  - accuracy

run:
  seed: 42
  resume: false
  dry_run: false
  checkpoint_every_n: 50
  prompt_version: "v1"
  concurrency_limit: 10
