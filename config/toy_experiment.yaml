# config/toy_experiment.yaml
#
# Onboarding config. Uses DummyBackend (fixed responses, no model weights,
# no API calls) against a deterministic 10-question synthetic dataset prepared
# with `choicebench-prepare-toy`, so the pipeline can be exercised without a
# GPU or API key.
#
# Real benchmark data (MMLU, ARC-Challenge) is NOT bundled in this repo —
# Generated data is not shipped in the package. See
# scripts/prepare_data.py for how real benchmark data is downloaded and
# normalized. Prepare the toy artifact once before running this config.

experiment:
  name: toy_experiment

models:
  - backend: dummy
    model_name_or_path: dummy_1
    device: cpu
    generation_kwargs:
      max_new_tokens: 16
      temperature: 0.0
      do_sample: false
  - backend: dummy
    model_name_or_path: dummy_2
    device: cpu
    generation_kwargs:
      max_new_tokens: 16
      temperature: 0.0
      do_sample: false

benchmarks:
  - name: toy
    split: test
    n_samples: 10
    subject_filter: null

methods:
  - name: direct_mcq

metrics:
  - accuracy

run:
  seed: 42
  resume: false
  dry_run: false
  checkpoint_every_n: 50
  prompt_version: "v1"
  concurrency_limit: 10
