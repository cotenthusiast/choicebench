# config/experiment_template.yaml
#
# Template for an experiment: one or more models, each run against one or
# more benchmarks, with a set of methods and metrics.
# Copy this file, fill in the fields below, and run:
#   python scripts/run_experiment.py --config path/to/your_config.yaml
#
# Validated by src/choicebench/config/schema.py — load_config() raises a
# ConfigError with a clear message if anything here is missing or
# inconsistent (e.g. a logprob method paired with an API backend).

experiment:
  # Free-form label for this experiment — used in output paths/logs only.
  name: my_experiment

# ---------------------------------------------------------------------------
# Models
# ---------------------------------------------------------------------------
# One entry per model. Every model is run against every benchmark below.
models:
  - # "huggingface" — local inference via HuggingFaceBackend. Supports any
    #   method with requires_logprobs: true (e.g. pride).
    # "api"         — API-backed inference via APIBackend + a provider client
    #   (see CLIENT_REGISTRY). generate() only; any method with
    #   requires_logprobs: true is rejected at config-load time, not at
    #   runtime. Requires a `provider:` key.
    # "dummy"       — DummyBackend: fixed responses, no model/API calls at
    #   all. For onboarding/smoke-testing the pipeline itself — see
    #   config/toy_experiment.yaml. Also supports requires_logprobs methods
    #   (fixed scores), so the full method set can be exercised without a GPU.
    backend: huggingface

    # HuggingFace hub ID (e.g. "Qwen/Qwen2.5-7B-Instruct") or local path when
    # backend: huggingface. Provider model name (e.g. "gpt-4.1-mini") when
    # backend: api.
    model_name_or_path: Qwen/Qwen2.5-7B-Instruct

    # Required when backend: api — must match a key in CLIENT_REGISTRY
    # ("anthropic" | "openai" | "gemini" | "groq" | "together" | "vllm").
    # Omit for other backends.
    # provider: openai

  # Anthropic API example:
  # - backend: api
  #   model_name_or_path: claude-opus-4-5    # or claude-sonnet-4-5, claude-haiku-4-5
  #   provider: anthropic
  #   generation_kwargs:
  #     max_new_tokens: 512
  #     temperature: 0.0
  #   # Note: seed is not supported by the Anthropic API and is silently ignored.

  # vLLM example — start the server first, then run ChoiceBench as usual:
  #   vllm serve meta-llama/Llama-3.1-8B-Instruct --port 8000
  # vLLM requires no additional Python packages; it runs as a separate server.
  # Unlike other API backends, vLLM supports logprob methods (e.g. pride)
  # because it exposes per-token log probabilities via its OpenAI-compatible API.
  # - model_name_or_path: meta-llama/Llama-3.1-8B-Instruct  # must match the model loaded in your vLLM server
  #   provider: vllm
  #   backend: api
  #   base_url: http://localhost:8000/v1        # your vLLM server address
  #   concurrency_limit: 5                      # tune to your GPU capacity
  #   generation_kwargs:
  #     max_new_tokens: 512
  #     temperature: 0.0

    # "cuda" | "cpu" | "auto" (auto = device_map=auto, for multi-GPU). Ignored
    # when backend: api.
    device: cuda

    generation_kwargs:
      max_new_tokens: 512
      temperature: 0.0
      do_sample: false

# ---------------------------------------------------------------------------
# Benchmarks
# ---------------------------------------------------------------------------
benchmarks:
  - # Any registered benchmark name (mmlu, arc_challenge, mmlu_pro, hellaswag,
    # truthful_qa) or "toy" (built-in) or "huggingface" (generic HF path).
    #
    # To add any HuggingFace MCQ benchmark:
    #   1. Create src/choicebench/benchmarks/<name>.py
    #   2. Decorate build_normalized_dataframe with @benchmark(...)
    #   3. Import it in src/choicebench/benchmarks/__init__.py
    #   4. Run: python scripts/prepare_data.py --hf-path <hf_path>
    #   5. Use name: <name> in your config
    #
    # No other files need to change.
    name: arc_challenge

    # Which split to draw from.
    split: test

    # Cap the number of questions for a quick/cheap run. null = use the full
    # split.
    n_samples: null

    # Restrict to specific subjects/categories (mainly meaningful for mmlu).
    # null = no filter.
    subject_filter: null

  # To run multiple benchmarks in one experiment, add more entries:
  # - name: mmlu
  #   split: test
  #   n_samples: null
  #   subject_filter: null

  # MMLU-Pro (prepare first: python scripts/prepare_data.py
  #   --hf-path TIGER-Lab/MMLU-Pro)
  # Note: questions with correct answer outside first 4 options
  # are skipped during preparation.
  # - name: mmlu_pro
  #   split: test
  #   n_samples: null
  #   subject_filter: null

  # HellaSwag (prepare first: python scripts/prepare_data.py
  #   --hf-path Rowan/hellaswag --split validation)
  # Note: use split: validation — test split has no labels.
  # - name: hellaswag
  #   split: validation
  #   n_samples: null

  # TruthfulQA (prepare first: python scripts/prepare_data.py
  #   --hf-path truthful_qa --hf-subset multiple_choice
  #   --split validation)
  # Note: uses mc1_targets (single correct answer format).
  # - name: truthful_qa
  #   split: validation
  #   n_samples: null

# HuggingFace benchmark example — run prepare_data.py first, then set name:
# benchmarks:
#   - name: huggingface
#     hf_path: cais/mmlu
#     hf_subset: all
#     split: test
#     output_name: mmlu  # optional; derived from hf_path if omitted

# ---------------------------------------------------------------------------
# Methods
# ---------------------------------------------------------------------------
# One entry per method to run against this model/benchmark. See
# src/choicebench/methods/ for the full list and what each does.
methods:
  - name: direct_mcq
  - name: cyclic_permutation
    # This built-in method has no params in v0.1.

  - name: two_stage
    # Optional: re-issue a direct MCQ prompt if stage 2 parsing is ambiguous (adds a 3rd call).
    # params:
    #   fallback_on_parse_failure: true

  # WARNING: YAML-driven PriDe runs use a UNIFORM prior unless a preflight
  # block is configured. Without preflight, this is logprob argmax only —
  # not calibration-fitted debiasing from Zheng et al., ICLR 2024.
  # To use the calibrated prior, add a preflight block to this method entry.
  # - name: pride
  #   requires_logprobs: true

  # Logprob cyclic permutation — Zheng et al. Eq. (1) averaging.
  # Requires a backend that exposes per-token logprobs (vLLM or HuggingFace).
  # More principled than cyclic_permutation (majority vote) because it uses the
  # full logprob distribution rather than a single argmax per permutation.
  # - name: cyclic_logprob
  #   requires_logprobs: true
  #   # backend: api
  #   # provider: vllm   # start server first: vllm serve <model> --port 8000
  #   # — or —
  #   # backend: huggingface

# ---------------------------------------------------------------------------
# Metrics
# ---------------------------------------------------------------------------
# Computed over this run's results. See
# src/choicebench/metrics/__init__.py's BUILTIN_METRICS for what's available.
metrics:
  - accuracy
  - mad
  # Add your own metric: subclass BaseMetric in
  # src/choicebench/metrics/<your_metric>.py (see
  # metrics/templates/base_metric_template.py) and list its name here.

# ---------------------------------------------------------------------------
# Run
# ---------------------------------------------------------------------------
run:
  seed: 42

  # Resume from a previous incomplete run of this experiment (checkpoint-
  # based) rather than starting over.
  resume: true

  # Validate this config and print a preflight estimate without making any
  # backend calls.
  dry_run: false

  # Number of questions to process between checkpoint saves.
  checkpoint_every_n: 50

  # Prompt template version to use (must match a subdirectory in prompts/).
  prompt_version: "v1"

  # Global default cap on in-flight API requests, applied to any model that
  # does not set its own concurrency_limit in the models: section above. A
  # per-model concurrency_limit overrides this (e.g. openai: 10, gemini: 1).
  # This is the knob that prevents provider rate-limit (429) errors; lower it
  # for stricter providers. Ignored for huggingface/dummy backends.
  concurrency_limit: 10
